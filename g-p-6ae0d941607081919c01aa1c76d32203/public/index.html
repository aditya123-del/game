<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arena Surge</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#061019;color:#edf7ff;font:14px system-ui}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;padding:22px;text-shadow:0 2px 4px #000}#brand{font-size:19px;font-weight:900;letter-spacing:.16em;color:#69eaff}#help{margin-top:7px;color:#bdd1df}#stats{position:absolute;right:22px;top:22px;text-align:right}#health{position:absolute;left:22px;bottom:22px;width:240px}#bar{margin-top:7px;height:13px;border:1px solid #76dfff;background:#102434}#fill{height:100%;background:linear-gradient(90deg,#f04e64,#ffd166,#50f3a0);transition:width .12s}#feed{position:absolute;right:22px;bottom:22px;width:300px;text-align:right;line-height:1.6}#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:30px}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#030a11c9;text-align:center;pointer-events:auto}#panel{max-width:470px;padding:35px;border:1px solid #28516d;background:#0c1d2b;border-radius:12px}input,button{width:100%;padding:12px;border-radius:7px;font:inherit}input{margin-bottom:10px;border:1px solid #477692;background:#071722;color:white}button{border:0;background:#55dff6;color:#05121d;font-weight:800;cursor:pointer;font-size:15px}</style></head><body><div id="hud"><div id="brand">ARENA SURGE</div><div id="help">WASD move · Mouse aim · Click fire · Esc release mouse</div><div id="stats">Score <b id="score">0</b><br><span id="players">Connecting…</span></div><div id="health">HEALTH <b id="health-number">100</b><div id="bar"><div id="fill"></div></div></div><div id="feed"></div><div id="crosshair">+</div></div><div id="overlay"><div id="panel"><h1>Arena Surge</h1><p>A compact online 3D battle arena. Eliminate opponents, then they respawn after three seconds.</p><form id="form"><input id="name" maxlength="14" placeholder="Ranger name"><button>Enter arena</button></form><p id="connection">Connecting…</p></div></div><script type="module" src="./game.js"></script></body></html>
